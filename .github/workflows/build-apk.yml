name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Updated to Node 24 due to Node 20 deprecation on GitHub runners
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          # CHANGE THIS PATH if your package-lock.json is inside a subfolder like 'keyhold-apk-project/'
          cache-dependency-path: './package-lock.json' 

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Using 'npm install' instead of 'npm ci' if you don't have a rigid package-lock.json
      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build --if-present

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x keyhold-apk-project/android/gradlew

      - name: Build debug APK
        working-directory: keyhold-apk-project/android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyhold-debug-apk
          path: keyhold-apk-project/android/app/build/outputs/apk/debug/app-debug.apk
