name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Removed the 'cache: npm' line temporarily to prevent lockfile conflicts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Automatically caches Gradle wrappers and dependencies to prevent slow network downloads
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # --yes auto-accepts any interactive project initialization prompts
      - name: Install dependencies
        run: npm install --yes --no-audit --no-fund

      - name: Build web application
        run: npm run build --if-present

      # --confirm auto-confirms any native Android installation prompts
      - name: Sync Capacitor Android
        run: npx cap sync android --confirm

      # Speeds up Gradle by using multiple cores, caching configurations, and disabling heavy daemons
      - name: Build debug APK
        working-directory: keyhold-apk-project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon \
            --parallel \
            --configuration-cache \
            --max-workers=$(nproc)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyhold-debug-apk
          path: keyhold-apk-project/android/app/build/outputs/apk/debug/app-debug.apk
