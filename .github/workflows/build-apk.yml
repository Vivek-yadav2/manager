name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node version
          cache: 'npm'       # Caches npm dependencies to speed up future runs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 1. Install your web app and Capacitor node dependencies
      - name: Install dependencies
        run: npm ci

      # 2. Build your web app project (Vue, React, Angular, Ionic, etc.)
      # This generates the web assets folder (e.g., dist/ or www/) that Capacitor needs
      - name: Build web application
        run: npm run build --if-present

      # 3. Copy web assets and generate the native android project links
      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x keyhold-apk-project/android/gradlew

      # 4. Added "clean" to make sure no corrupt layout configurations are cached
      - name: Build debug APK
        working-directory: keyhold-apk-project/android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyhold-debug-apk
          path: keyhold-apk-project/android/app/build/outputs/apk/debug/app-debug.apk
